# Paths
maf_dir: example_data/example.maf/
reference_fasta: example_data/example.reference.fa

# Output location
results_dir: example_results

# Direct MAF pipeline options
# max_missing_count: 0
max_missing_fraction: 0.0
mask_indel_adjacent_snps: false
allow_multiallelic_snps: true
add_ref: false

# Per-sample assembly-quality masking (disabled by default).
# Point quality_bed_dir at a directory of <sample>.bed / <sample>.bed.gz files
# in each sample's own genome coordinates (chrom start end score, score 0-1);
# aligned bases scoring below quality_min are treated as missing.
# quality_bed_dir: example_data/quality_beds
# quality_min: 0.9

# Rule-specific resources
maf_mem_mb: 96000
maf_time: "72:00:00"

# SLURM profile defaults
slurm_account: jrigrp
slurm_partition: high

# First-stage MAF QC (`snakemake ... maf_qc`; never part of the default run).
# maf_stats_dotplots: flagged        # flagged | all | false
# maf_stats_dotplot_max: 20
# maf_stats_min_block_bp: 0
# maf_stats_overlap_tolerance_bp: 0
# query_fasta_dir: path/to/assemblies  # <sample>.fa[.gz] etc.; adds assembly metrics
# query_fai_dir: path/to/query_fais     # lengths only; alternative to query_fasta_dir
# maf_stats_breakpoint_context_bp: 1000000
# maf_stats_recurrence_window_bp: 500000
# maf_stats_flag_min_identity: 95
